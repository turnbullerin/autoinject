version: 2.1
orbs:
  python: circleci/python@4.0.0
jobs:
  test:
    executor: python/default
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements/dev.txt
      - run: python -m unittest

workflows:
  main_workflow:
    jobs:
      - test
